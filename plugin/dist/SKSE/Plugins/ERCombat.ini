; Elden Ring combat for Skyrim. Press Toggle (Ä) to switch Elden Ring mode on
; or off. While it is on, combat mode runs whenever a weapon is drawn.

[General]
; 0: Precision and your combat mods decide what a swing hits (phase A).
; 1: the core's own Elden Ring hit detection decides (phase B, not finished).
CoreHitDetection=0

[Pose]
; 1: play the real Elden Ring animations on your character (needs
; ERCombat.eranims next to ERCombat.dll; made with er_anims from your own
; player_anims.bin). Without the file, Skyrim's animations play as before.
Enabled=1
; Where the pose is written: 1 after the player's animation update (default),
; 0 after the player's update. Try 0 if ERCombat.log says the pose is being
; written but your character still moves like Skyrim.
Hook=1
; Whose animation shows for rolls and jumps. The core still decides when they
; start, how long they last, the i-frames and the stamina either way.
; Rolls=TKDodge: TK Dodge's directional rolls (events in [Events] below).
; Rolls=ER: the Elden Ring roll on your skeleton.
Rolls=TKDodge
; Jumps=Skyrim: Skyrim's own jump, which really leaves the ground (you can jump
; onto things); a jump attack still shows the Elden Ring swing on the airborne
; body. Jumps=ER: the Elden Ring jump animation, but your character doesn't
; physically leave the ground.
Jumps=Skyrim
; While the pose plays: the core's root motion moves you during rolls, attacks
; and jumps (0: they play on the spot). Skyrim's collision has the last word
; only through the character controller; report anything that walks through walls.
RootMotion=1
; The core decides what a swing hits; the hit itself goes through Skyrim's own
; melee hit, so skill, perks, smithing, enchantments, blocking, armour, blood,
; sounds, stagger and aggro all apply. That damage is then multiplied by the
; swing's Elden Ring motion value (light about 1.0, heavy 1.25+, charged and
; jump attacks more) and by DamageScale.
DamageScale=1.0
; Extra reach of the hit test around each target's body, in Skyrim units
; (70 = 1 m). Raise it if swings that look like hits miss.
HitPadding=20
; Camera shake on a hit (0 = none), times the swing's motion value.
HitShake=0.3
; Sound descriptor (editor ID) played on a hit; empty = none.
HitSound=

[LockOn]
; Elden Ring's lock-on replaces True Directional Movement's while Elden Ring
; mode is on (TDM 2.2+ is told to keep its own lock off). Metres.
Range=15
BreakRange=22

[Keys]
; Keyboard keys are DirectInput scan codes. Mouse: 256 left, 257 right, 258 middle.
Toggle=40         ; Ä on a German keyboard (' on US): Elden Ring mode on/off
Dodge=56          ; Left Alt: tap to roll, hold to sprint
Jump=57           ; Space
Light=256         ; Left mouse
Guard=257         ; Right mouse: guard, or the left-hand weapon's attack
HeavyModifier=42  ; Left Shift + Light = heavy attack (hold to charge)
Walk=58           ; Caps Lock toggles walking
LockOn=258        ; Middle mouse: lock on to the enemy you look at, again to let go
LockOnGamepad=128 ; Gamepad R3 (XInput button code): the same
; Jump attack: Jump, then Light (or Heavy) in the air. Crouch follows Skyrim's
; Sneak key; Light while crouched is the crouch attack.

[Events]
; Animation event sent to Skyrim when each action starts. Leave empty to send
; nothing. Rolls and hit reactions first try the event plus Forward, Back,
; Left or Right (TKDodgeForward...), then the plain name.
Roll=TKDodge
CrouchRoll=TKDodge
Backstep=TKDodgeBack
Jump=JumpStandingStart
LightAttack=attackStart
HeavyCharge=
HeavyAttack=attackPowerStartInPlace
RunAttack=attackStartSprint
RollAttack=attackStart
BackstepAttack=attackStart
CrouchAttack=attackStart
JumpAttackLand=attackPowerStartInPlace
GuardCounter=attackPowerStartInPlace
LeftAttack=attackStartLeftHand
Hurt=
; Raising and lowering the guard (hold Guard with a shield, or two-handed).
BlockStart=blockStart
BlockStop=blockStop
